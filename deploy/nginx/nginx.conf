# nginx.conf — Oracle VM reverse proxy
# Replace YOUR_DOMAIN with your actual domain (e.g. meetmind.ai)
#
# Handles:
#   https://meetmind.ai          → React website (web container :3000)
#   https://api.meetmind.ai      → FastAPI backend (api container :8000)
#   https://api.meetmind.ai/ws   → Recall.ai realtime WebSocket (:8766)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/opentype;
    gzip_min_length 1024;

    # Rate limiting — protect the API from abuse
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name taskora.in.net api.taskora.in.net;

        # Allow certbot to verify domain ownership
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Landing / React website ───────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name taskora.in.net;

        ssl_certificate     /etc/letsencrypt/live/taskora.in.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taskora.in.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://web:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── API + WebSocket ───────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.taskora.in.net;

        ssl_certificate     /etc/letsencrypt/live/taskora.in.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taskora.in.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # FastAPI REST + SSE
        location / {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE: disable buffering so log lines stream immediately
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # Recall.ai realtime WebSocket (wss://api.YOUR_DOMAIN/realtime)
        location /realtime {
            proxy_pass         http://api:8766;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
